# docker compose -f deploy/compose.yaml up -d --build
# 测试：docker compose -f deploy/compose.yaml run --rm test
name: corpus

x-python-env: &python-env
  DATABASE_URL: postgresql+psycopg://corpus:${POSTGRES_PASSWORD:?set in deploy/.env}@postgres:5432/corpus
  # 服务器时区：模型用量按此时区的自然月统计（api、worker 与 agent 须一致）
  TZ: ${TZ:-Asia/Shanghai}
  DATA_DIR: /data
  STANZA_RESOURCES_DIR: /stanza
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
  # 检索命中计数超时（秒），超时后返回不完整计数
  SEARCH_COUNT_TIMEOUT: ${SEARCH_COUNT_TIMEOUT:-20}
  # 首次超时后后台完整计数的上限（秒），超过则计数失败
  SEARCH_FULL_TIMEOUT: ${SEARCH_FULL_TIMEOUT:-300}
  # 一次检索的命中上限，超过则计数失败；检索结果集（DATA_DIR/search-cache）总字节上限
  SEARCH_MAX_HITS: ${SEARCH_MAX_HITS:-2000000}
  SEARCH_CACHE_MAX_BYTES: ${SEARCH_CACHE_MAX_BYTES:-2147483648}
  # worker 同时加载的 Stanza 语言管线数（每种约 330 MB 内存）；语义索引句数上限
  STANZA_MAX_PIPELINES: ${STANZA_MAX_PIPELINES:-2}
  SEMANTIC_MAX_SENTENCES: ${SEMANTIC_MAX_SENTENCES:-300000}
  # 压缩格式解压后总字节、文件数与 PDF 页数上限
  MAX_UNPACKED_BYTES: ${MAX_UNPACKED_BYTES:-524288000}
  MAX_UNPACKED_FILES: ${MAX_UNPACKED_FILES:-10000}
  MAX_PDF_PAGES: ${MAX_PDF_PAGES:-5000}
  # 短任务门槛：上传小于此字节数的导入、词数小于此值的建索引算短任务（worker-light 也处理，各 worker 优先取短任务）
  LIGHT_IMPORT_BYTES: ${LIGHT_IMPORT_BYTES:-5242880}
  LIGHT_INDEX_TOKENS: ${LIGHT_INDEX_TOKENS:-1000000}
  # 知识库向量模型：本地 sentence-transformers 缓存在 models 卷；EMBED_PROVIDER=openai 时走远程 /embeddings
  MODELS_DIR: /models
  HF_HOME: /models
  HF_HUB_DISABLE_TELEMETRY: "1"
  EMBED_PROVIDER: ${EMBED_PROVIDER:-local}
  EMBED_MODEL: ${EMBED_MODEL:-}
  EMBED_BASE_URL: ${EMBED_BASE_URL:-}
  EMBED_API_KEY: ${EMBED_API_KEY:-}
  EMBED_DIM: ${EMBED_DIM:-}
  # 每位用户每月对话模型 token 上限（0 = 不限）：api 在预标、文献摘要与术语抽取发起时检查
  LLM_MONTHLY_TOKENS_PER_USER: ${LLM_MONTHLY_TOKENS_PER_USER:-0}
  # 删除的项目保留天数（期间可恢复，之后 worker 维护任务清除）；导出文件保留天数
  PROJECT_PURGE_DAYS: ${PROJECT_PURGE_DAYS:-7}
  EXPORT_RETENTION_DAYS: ${EXPORT_RETENTION_DAYS:-30}

# 常驻服务：异常退出或宿主机重启后自动拉起；容器日志单文件 20 MB，保留 5 个
x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    <<: *service
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: corpus
      POSTGRES_USER: corpus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "corpus", "-d", "corpus"]
      interval: 2s
      retries: 30

  api:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile.api, target: api }
    environment:
      <<: *python-env
      # 设置页与 /system/info 显示的版本号
      APP_VERSION: ${APP_VERSION:-dev}
      # 只用于 /system/info 显示模型主机与模型名（密钥不进 api）
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_ID: ${MODEL_ID:-}
      # 管理 · 系统显示最近备份时间：只读挂载宿主机备份目录（scripts/backup.sh 的输出目录）
      BACKUP_DIR: /backups
    volumes:
      - data:/data
      - models:/models
      - ${BACKUP_DIR:-../tmp/backups}:/backups:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      retries: 40

  # 处理全部任务类型。增加导入/索引并发：docker compose ... up -d --scale worker=2
  worker: &worker
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile.worker }
    environment: &worker-env
      <<: *python-env
      # 摘要与术语草稿调用的对话模型（与 agent 相同）
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_ID: ${MODEL_ID:-}
      MODEL_API: ${MODEL_API:-openai-completions}
      # 每日维护（清除超期删除的项目、过期导出与失败上传）只由 worker-light 执行
      WORKER_MAINTENANCE: "0"
    volumes:
      - data:/data
      - stanza:/stanza
      - models:/models
    depends_on:
      api: { condition: service_healthy }
    # 主循环（空闲轮询与任务心跳）更新 /data/worker-health/<WORKER_ID>，90 秒内未更新判为不健康
    healthcheck:
      test: ["CMD", "python", "-c", "import os, socket, sys, time; p = '/data/worker-health/' + (os.environ.get('WORKER_ID') or socket.gethostname()); sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 90 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 只处理短任务：统计、导出、预标注、知识库，以及小文件导入和小语料建索引；大导入运行时它们不排队
  worker-light:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_KINDS: export,stats,preannotate,kb_import,kb_summarize,kb_extract
      WORKER_SMALL_IMPORTS: "1"
      WORKER_MAINTENANCE: ${WORKER_MAINTENANCE:-1}

  agent:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile.agent }
    environment:
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_ID: ${MODEL_ID:-}
      MODEL_API: ${MODEL_API:-openai-completions}
      API_BASE_URL: http://api:8000/api
      DATABASE_URL: postgresql://corpus:${POSTGRES_PASSWORD:?set in deploy/.env}@postgres:5432/corpus
      DATA_DIR: /data/agent
      TZ: ${TZ:-Asia/Shanghai}
      PORT: "8700"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      # 每位用户每月 token 上限（0 = 不限）；每位用户同时运行的对话数
      LLM_MONTHLY_TOKENS_PER_USER: ${LLM_MONTHLY_TOKENS_PER_USER:-0}
      AGENT_MAX_RUNS_PER_USER: ${AGENT_MAX_RUNS_PER_USER:-2}
    volumes:
      - agentdata:/data/agent
    depends_on:
      api: { condition: service_healthy }

  web:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    depends_on:
      - api
      - agent

  test:
    profiles: [test]
    build: { context: .., dockerfile: deploy/Dockerfile.api, target: test }
    environment:
      <<: *python-env
      TEST_DATABASE_URL: postgresql+psycopg://corpus:${POSTGRES_PASSWORD}@postgres:5432/corpus_test
    volumes:
      - ..:/app
      - stanza:/stanza
      - models:/models
    depends_on:
      postgres: { condition: service_healthy }
    command: ["pytest", "-p", "no:cacheprovider", "-q"]

volumes:
  pgdata:
  data:
  stanza:
  agentdata:
  models:
