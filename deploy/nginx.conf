# 本文件作为 conf.d/default.conf 加载，server 块外的指令处于 http 上下文
# 登录限流：每个客户端 IP 每分钟 10 次，可突发 5 次，超出返回 429
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 500m;
    # 容器重建后 IP 会变：用 Docker DNS 动态解析上游，避免 nginx 缓存旧地址
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $agent_upstream http://agent:8700;

    # 前面有宿主机反代时，从 X-Forwarded-For 取真实客户端 IP（只信任本机与私网来源）。
    # 不递归：取宿主反代追加的最后一个地址，客户端自填的 X-Forwarded-For 不影响限流
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @login_limited;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 与 api 错误格式一致，登录页直接显示 message
    location @login_limited {
        default_type "application/json; charset=utf-8";
        return 429 '{"error":{"code":"LOGIN_RATE_LIMITED","message":"登录尝试过多，请 1 分钟后再试"}}';
    }

    # 接口文档不对外
    location ^~ /api/docs {
        return 404;
    }

    location = /api/openapi.json {
        return 404;
    }

    # agent 会话 SSE：不缓冲，长读超时
    location /agent/ {
        proxy_pass $agent_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }

    # 入口页不缓存：重新部署后浏览器立即取到新的分块文件名
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
