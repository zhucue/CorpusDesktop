name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.21
      - run: uv sync --frozen --python 3.12.14
      - run: npm ci --prefix services/agent-runtime --ignore-scripts
      - run: npm ci --prefix apps/web --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: uv run --frozen pytest
      - run: uv run --frozen ruff check services/api workers scripts tests/api pipelines/security tests/integration pipelines/alignment tests/alignment pipelines/sources/tatoeba.py tests/sources/test_tatoeba.py tests/contracts/validate_sync_report.py tests/contracts/test_sync_report.py pipelines/exports tests/exports
      - run: python scripts/init_dev_env.py
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml config --quiet
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml up -d --wait database broker object-storage
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml build api db-bootstrap migrate test-auth worker dispatcher index-worker test-index agent-host
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm db-bootstrap
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm migrate
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm storage-init
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm test-auth
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm test-auth python -m unittest discover -s tests/integration -p test_catalog_pipeline.py -v
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm test-auth python -m unittest discover -s tests/api -p test_agent_runtime.py -v
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm test-auth python -m unittest discover -s tests/api -p test_agent_checkpoints.py -v
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm test-auth python -m unittest discover -s tests/api -p test_agent_waiting.py -v
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm test-auth python -m unittest discover -s tests/api -p test_agent_provider.py -v
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm test-auth python -m unittest discover -s tests/integration -p test_upload_pipeline.py -v
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm test-auth python -m unittest discover -s tests/integration -p test_source_sync_pipeline.py -v
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm test-index
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm test-index python -m unittest discover -s tests/integration -p test_source_releases.py -v
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm test-index python -m unittest discover -s tests/integration -p test_research_queries.py -v
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm test-index python -m unittest discover -s tests/integration -p test_private_materials.py -v
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm test-index python -m unittest discover -s tests/integration -p test_outcomes_pipeline.py -v
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml --profile worker up -d --wait api worker dispatcher index-worker
      - name: Real local fixture cross-process job continuation
        env:
          CORPUS_AGENT_RUNTIME_MODE: fixture
        run: |
          docker compose --env-file deploy/.env -f deploy/compose.yaml up -d --wait api
          uv run --frozen python -m scripts.agent_waiting_smoke
      - name: Built-in model adapters against synthetic loopback SSE and real job continuation
        env:
          CORPUS_AGENT_RUNTIME_MODE: openai-compatible
          AGENT_MODEL_BASE_URL: http://127.0.0.1:18093/v1
          AGENT_MODEL_ID: research-model-v1
          AGENT_MODEL_ALLOW_LOOPBACK_HTTP: "true"
        run: |
          for api in openai-completions openai-responses; do
            export AGENT_MODEL_API="$api"
            docker compose --env-file deploy/.env -f deploy/compose.yaml up -d --wait api
            uv run --frozen python -m scripts.agent_provider_smoke
          done
      - name: Restore unconfigured API runtime
        if: always()
        run: docker compose --env-file deploy/.env -f deploy/compose.yaml up -d --wait api
      - if: always()
        run: docker compose --env-file deploy/.env -f deploy/compose.yaml down
