[project]
name = "corpus-workbench"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "argon2-cffi>=25.1,<26",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "lxml>=5.3,<7",
  "stanza>=1.10,<2",
  "torch>=2.5,<3",
  "jieba>=0.42,<1",
  "pypdf>=5,<7",
  "trafilatura>=2,<3",
  "sentence-transformers>=3.4,<6",
  "pgvector>=0.3,<1",
]

[dependency-groups]
dev = [
    "conllu>=6,<7",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
extend-exclude = ["tmp", ".venv", "doc/history"]

[tool.uv]
package = false

# Stanza 依赖 torch；只用 CPU 版，避免镜像拉入 CUDA 包
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
